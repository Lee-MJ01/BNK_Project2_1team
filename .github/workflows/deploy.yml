name: Deploy backend to GCP

on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/**', '.github/workflows/**', '.gitleaks.toml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for exposed credentials
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          python scripts/security.py setup
          python scripts/security.py check
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/security.py range --base "$BASE_SHA"
          fi
          python -m unittest discover -s scripts/tests -v
      - name: Prepare runtime environment
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SLAVE_DB_URL: ${{ secrets.SLAVE_DB_URL }}
          SLAVE_DB_USERNAME: ${{ secrets.SLAVE_DB_USERNAME }}
          SLAVE_DB_PASSWORD: ${{ secrets.SLAVE_DB_PASSWORD }}
          ELASTIC_URI: ${{ secrets.ELASTIC_URI }}
          ELASTIC_USERNAME: ${{ secrets.ELASTIC_USERNAME }}
          ELASTIC_PASSWORD: ${{ secrets.ELASTIC_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          AES_SECRET: ${{ secrets.AES_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EXIM_AUTH_KEY: ${{ secrets.EXIM_AUTH_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_PHONE: ${{ secrets.SOLAPI_PHONE }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          JUSO_API_KEY: ${{ secrets.JUSO_API_KEY }}
          FLOBANK_AP_HOST: ${{ secrets.FLOBANK_AP_HOST }}
          AI_SERVER_URL: ${{ secrets.AI_SERVER_URL }}
          AI_SERVER_QNA_URL: ${{ secrets.AI_SERVER_QNA_URL }}
          AI_SERVER_RECO_URL: ${{ secrets.AI_SERVER_RECO_URL }}
        run: python scripts/write_deploy_env.py .tools/deploy.env
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Build and test backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean assemble test --tests '*AddressSearchServiceTest' --no-daemon
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Transfer release and restart services
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RELEASE_DIR="/tmp/flobank-release-$RELEASE_ID"
          gcloud compute ssh bnk-api-server --project="$GCP_PROJECT_ID" --zone=asia-northeast3-a \
            --command="umask 077; mkdir -p '$RELEASE_DIR'"
          JAR_FILE=$(find backend/build/libs -name '*.jar' ! -name '*-plain.jar' -print -quit)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" .tools/app.jar
          gcloud compute scp .tools/app.jar backend/Dockerfile backend/.dockerignore backend/docker-compose.yml \
            .tools/deploy.env backend/nginx/default.conf "bnk-api-server:$RELEASE_DIR/" \
            --project="$GCP_PROJECT_ID" --zone=asia-northeast3-a
          gcloud compute ssh bnk-api-server --project="$GCP_PROJECT_ID" --zone=asia-northeast3-a \
            --command="set -eu
              trap 'rm -f $RELEASE_DIR/deploy.env' EXIT
              test -f /opt/keys/firebase-sa.json
              sudo mkdir -p /opt/flobank-backend/files /opt/flobank-backend/nginx
              sudo install -m 600 '$RELEASE_DIR/deploy.env' /opt/flobank-backend/.env
              sudo install -m 644 '$RELEASE_DIR/app.jar' /opt/flobank-backend/app.jar
              sudo install -m 644 '$RELEASE_DIR/Dockerfile' /opt/flobank-backend/Dockerfile
              sudo install -m 644 '$RELEASE_DIR/.dockerignore' /opt/flobank-backend/.dockerignore
              sudo install -m 644 '$RELEASE_DIR/docker-compose.yml' /opt/flobank-backend/docker-compose.yml
              sudo install -m 644 '$RELEASE_DIR/default.conf' /opt/flobank-backend/nginx/default.conf
              cd /opt/flobank-backend
              sudo docker-compose config --quiet
              sudo docker-compose up -d --build
            "
      - name: Remove runner credentials
        if: always()
        run: rm -f .tools/deploy.env
