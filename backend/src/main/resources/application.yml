server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /backend
    session:
      cookie:
        path: /

app-version: '@version@'

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # 1. Master DB (기존과 동일)
    master:
      jdbc-url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: Master-HikariCP
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000

    # 2. Slave DB (환경변수로 변경함)
    slave:
      jdbc-url: ${SLAVE_DB_URL}
      username: ${SLAVE_DB_USERNAME}
      password: ${SLAVE_DB_PASSWORD}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: Slave-HikariCP
        maximum-pool-size: 10
        minimum-idle: 5
        connection-timeout: 30000

  #  profiles:
  #    active: dev
  elasticsearch:
    uris: ${ELASTIC_URI}
    username: ${ELASTIC_USERNAME}
    password: ${ELASTIC_PASSWORD}


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD:}
      port: 6379


flobank:
  ap:
    host: ${FLOBANK_AP_HOST}
    port: 9090
  aes:
    secret: ${AES_SECRET}


jwt:
  secret: ${JWT_SECRET}

eximbank:
  api:
    base-url: "https://oapi.koreaexim.go.kr/site/program/financial/exchangeJSON"
    auth-key: ${EXIM_AUTH_KEY}

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: "https://api.openai.com/v1"

solapi:
  apiKey: ${SOLAPI_API_KEY}
  apiSecret: ${SOLAPI_API_SECRET}
  phoneNumber: ${SOLAPI_PHONE}

terms:
  base-dir: ${TERMS_BASE_DIR:./files/terms}

pinecone:
  api-key: ${PINECONE_API_KEY}
  index-host: ${PINECONE_INDEX_HOST}
  index-name: bank-db

file:
  upload:
    pdf-ai-path: /app/uploads/pdf_ai
    pdf-products-path: /app/uploads/pdf_products
    pdf-terms-path: /app/uploads/terms

deepl:
  api:
    key: ${DEEPL_API_KEY}

ai-server:
  url: ${AI_SERVER_URL}

ai-server-qna:
  url: ${AI_SERVER_QNA_URL}

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

juso:
  api-key: ${JUSO_API_KEY:}


logging:
  level:
    kr.co.api.backend.mapper.DepositMapper: DEBUG
    org.mybatis: DEBUG

ai-server-reco:
  url: ${AI_SERVER_RECO_URL:${AI_SERVER_URL}}
